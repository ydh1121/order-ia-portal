<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="description" content="서비스 준비 중">
  <meta name="color-scheme" content="light">
  <title>order.ooo — 서비스 준비 중</title>
  <style>
    :root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;color:#18303c;background:#f4f7f8}
    *{box-sizing:border-box}
    body{min-height:100svh;margin:0;display:grid;place-items:center;padding:24px}
    main{width:min(100%,460px);background:#fff;border:1px solid #dfe7ec;border-radius:20px;padding:clamp(28px,6vw,44px);box-shadow:0 10px 40px #0c27300b;text-align:center}
    h1{font-size:clamp(22px,5vw,28px);margin:0 0 18px;letter-spacing:-.04em}
    p{margin:0;color:#5b6b75;line-height:1.8;font-size:15px}
    small{display:block;color:#7d8d96;margin-top:28px;font-size:12px}
  </style>
</head>
<body>
  <main aria-labelledby="status-heading">
    <h1 id="status-heading">서비스 준비 중입니다</h1>
    <p>현재 서비스를 준비하고 있습니다.<br>정식 이용 안내는 준비가 완료되면 제공됩니다.</p>
    <small>order.ooo</small>
  </main>
</body>
</html>
