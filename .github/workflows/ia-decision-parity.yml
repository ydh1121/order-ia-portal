name: IA scoped decision parity QA

on:
  pull_request:
    paths:
      - 'src/**'
      - 'functions/**'
      - 'public/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/ia-decision-parity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ia:
    name: IA Node 22 read-only regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: 'false'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Record exact checkout and continued document candidate identity
        shell: bash
        run: |
          set -euo pipefail
          node --version
          git rev-parse HEAD
          git rev-parse 'HEAD^{tree}'
          python3 - <<'PY'
          import hashlib, pathlib, json
          expected = {
            'docs/IA_QA_PRIVATE_SOURCE_DOCUMENT_CONTRACT.md':'7dfee48dc6c69d4dd811027f950fdcb526ea9573',
            'functions/api/ia/qa/[[route]].js':'0fd897ce1823f2e4278448ddbead6fe3f1a8a423',
            'functions/ia/[[path]].js':'4251d84a0b8d15e275079a8cec4cdafc3dc36857',
            'scripts/check-r3-original-contract.mjs':'c4058c57e6bc2d7ece8a47828b61cdf733050aa8',
            'src/server/qa-api.mjs':'d04bca4e1bbe5e12169667babcc18266c5eb2760',
            'src/server/qa-client.mjs':'074091f966eec7bbd9d3abb410c99bd858aa2b7c',
            'src/server/qa-document.mjs':'bd6f5215f35e58869156d6f5b41cc9b1b036f178',
            'src/server/qa-drive-source.mjs':'f184f02f23e9b4abc365144ed84e23459e899767',
            'src/server/qa-host.mjs':'dafc7f57e86748b1ab8fe04f71b3f7a924b627e6',
            'src/server/qa-page.mjs':'3edebe9fa93e3ad92dd094e2cd9c658b2bfb1669',
            'src/server/qa-r3-runtime.mjs':'bcc3bcf9ec44fe8bd5eef0c1ec8205848e629fda',
            'src/server/qa-registry.mjs':'879ac0980bcb12a29e04e8d3ade6e5c36fe393e2',
            'src/server/qa-research-permit.mjs':'c216e1a259e4c447b0031f11cedfe8b38884ffe4',
            'src/server/qa-zip-content.mjs':'cd4d9e39d099ebbde0e0584daadb4f7ec95750d4',
            'tests/helpers/qa-contract-fixtures.mjs':'23d697ca6f6d3aaf166ca54871739b3ca32c1fc0',
            'tests/qa-drive-source-contract.test.mjs':'018fd4eb7d27ce89001a38492d90a547c6ef4d92',
            'tests/qa-http-host.test.mjs':'b75bc399bf22067b425fbb7f17e7d2862d4dc637',
            'tests/qa-menus-0560.test.mjs':'8ad7c9c1083de10308ba80a15f7583fff7a9fd59',
            'tests/qa-r3-readiness-api.test.mjs':'bd05cc3f63e708332e640f52df21becd430bc7ca',
            'tests/qa-r3-runtime.test.mjs':'667bd37e82c9db16a1e65933ff129ef1f14c8a91',
            'tests/qa-research-document.test.mjs':'fbdb49e768defc693ba436561cb19ab676d398d8',
            'tests/qa-zip-content.test.mjs':'3df59cf3ef5e421d7d2e40e035f0b2da4a483b22'
          }
          for name, sha in expected.items():
            data = pathlib.Path(name).read_bytes()
            actual = hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
            assert actual == sha, name+' differs from continued MSG0566 candidate'
          print(json.dumps({'candidate_files':len(expected),'blob_matches':len(expected),'native':'NOT_RUN'}))
          PY
      - name: Full repository IA suite
        shell: bash
        run: |
          set -euo pipefail
          npm run test:ia | tee "$RUNNER_TEMP/ia-full-test.tap"
      - name: Previously omitted QA menu suite (subset, not additive)
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/qa-menus-0560.test.mjs | tee "$RUNNER_TEMP/ia-qa-menus.tap"
      - name: Compile existing Pages Functions only - no deployment
        shell: bash
        run: |
          set -euo pipefail
          test -z "${CLOUDFLARE_API_TOKEN:-}"
          test -z "${CLOUDFLARE_API_KEY:-}"
          npm exec --yes --package=wrangler@4.45.0 -- wrangler pages functions build functions --outdir "$RUNNER_TEMP/ia-functions-build" --output-routes-path "$RUNNER_TEMP/ia-routes.json" --build-metadata-path "$RUNNER_TEMP/ia-build-metadata.json" --compatibility-date 2026-10-15
          python3 - <<'PY'
          import pathlib, hashlib, gzip, os, json
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'ia-functions-build'
          files=[p for p in root.rglob('*') if p.is_file()]
          assert files, 'No compiled Functions output'
          result=[]
          for p in files:
            data=p.read_bytes()
            result.append({'path':str(p.relative_to(root)),'bytes':len(data),'gzip_bytes':len(gzip.compress(data,mtime=0)),'sha256':hashlib.sha256(data).hexdigest()})
          public=[]
          for p in pathlib.Path('public').rglob('*'):
            if p.is_file():
              data=p.read_bytes()
              public.append({'path':str(p),'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()})
          report={'mode':'BUILD_ONLY_NO_DEPLOY','functions':result,'public':public,'native':'NOT_RUN'}
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'ia-build-summary.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          PY
          git diff --exit-code
      - name: Preserve private CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ia-msg0566-code-build-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/ia-full-test.tap
            ${{ runner.temp }}/ia-qa-menus.tap
            ${{ runner.temp }}/ia-build-summary.json
            ${{ runner.temp }}/ia-build-metadata.json
            ${{ runner.temp }}/ia-routes.json
          if-no-files-found: warn
          retention-days: 14
