name: IA private QA
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ia:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install DOM and bundler test dependencies
        run: npm install --prefix tests/build-tools --no-package-lock --no-audit --no-fund
      - name: Verify canonical product source manifest
        run: node scripts/build-product-manifest.mjs --check
      - name: Verify R1 QA and product runtime sources agree
        run: node scripts/r3/build-qa-review-runtime.mjs --check
      - name: Verify research application sources and immutable release packs
        run: |
          node scripts/build-research-app.mjs --check
          node scripts/seal-research-release.mjs --check
      - run: npm run test:ia
      - name: Check serialized clients after Worker bundling
        run: |
          node tests/r3-bundled-clients.mjs
          node tests/r3-price-book-dom.mjs
          node tests/r3-price-workspace-dom.mjs
          node tests/r3-admin-common-dom.mjs
          node tests/r3-async-motion-dom.mjs
      - name: Compile Pages Functions with the deployment builder
        env:
          WRANGLER_SEND_METRICS: 'false'
        run: npx --yes wrangler@3.114.17 pages functions build functions --outfile="$RUNNER_TEMP/order-ia-worker.bundle"
      - name: Check the Pages Functions upload size limit
        run: node scripts/check-pages-bundle-size.mjs "$RUNNER_TEMP/order-ia-worker.bundle"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and verify Korean fonts for rendered QA
        run: |
          if ! fc-list ':lang=ko' family | grep -F 'Noto Sans CJK' > /dev/null; then
            sudo apt-get -o Acquire::Retries=3 update -qq
            sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends fonts-noto-cjk
            fc-cache -f
          fi
          fc-list ':lang=ko:charset=ac00' family | sort -u
          fc-list ':lang=ko:charset=ac00' family | grep -F 'Noto Sans CJK' > /dev/null
          fc-match 'sans-serif:lang=ko' --format '%{family} | %{file}\n'
      - run: python -m pip install playwright==1.56.0
        id: browser-deps
      - name: Check persisted MVP menus, component review, pass flip and withdrawal guards
        if: ${{ !cancelled() && steps.browser-deps.outcome == 'success' }}
        env:
          R3_BROWSER_BINARY: /usr/bin/google-chrome
        run: python tests/r3-qa-mvp-browser.py
      - name: Check per-mode server drafts and cancellation on real Pages routes
        if: ${{ !cancelled() && steps.browser-deps.outcome == 'success' }}
        env:
          R3_BROWSER_BINARY: /usr/bin/google-chrome
        run: python tests/r3-quote-draft-browser.py
      - name: Check the four-menu price workspace at four widths
        if: ${{ !cancelled() && steps.browser-deps.outcome == 'success' }}
        env:
          R3_BROWSER_BINARY: /usr/bin/google-chrome
        run: python tests/r3-price-workspace-browser.py
      - name: Check the actual MVP workspace and dummy states inside the R1 review shell
        if: ${{ !cancelled() && steps.browser-deps.outcome == 'success' }}
        env:
          R3_BROWSER_BINARY: /usr/bin/google-chrome
        run: python tests/r3-qa-workspace-browser.py
      - name: Check saved business accounts and both real quote forms
        if: ${{ !cancelled() && steps.browser-deps.outcome == 'success' }}
        env:
          R3_BROWSER_BINARY: /usr/bin/google-chrome
        run: python tests/r3-saved-business-browser.py
      - name: Compare approved QA 1.0 and protected R3 shell at matching viewports
        if: ${{ !cancelled() && steps.browser-deps.outcome == 'success' }}
        env:
          R3_BROWSER_BINARY: /usr/bin/google-chrome
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python tests/r3-approved-shell-browser.py
      - name: Check protected navigation, SQLite transactions and product forms
        if: ${{ !cancelled() && steps.browser-deps.outcome == 'success' }}
        env:
          R3_BROWSER_BINARY: /usr/bin/google-chrome
        run: python tests/r3-browser.py
      - name: Check annotations, pin restoration and editable download
        if: ${{ !cancelled() && steps.browser-deps.outcome == 'success' }}
        env:
          R3_BROWSER_BINARY: /usr/bin/google-chrome
        run: python tests/r3-annotation-browser.py
      - name: Restore previous feedback pins and distinguish their provenance
        if: ${{ !cancelled() && steps.browser-deps.outcome == 'success' }}
        env:
          R3_BROWSER_BINARY: /usr/bin/google-chrome
        run: python tests/r3-pin-restoration-browser.py
      - name: Check detailed quote lists, keyboard and swipe confirmation
        if: ${{ !cancelled() && steps.browser-deps.outcome == 'success' }}
        env:
          R3_BROWSER_BINARY: /usr/bin/google-chrome
        run: python tests/r3-questions-browser.py
      - name: Verify pending, failure and retry in the signed price editor
        if: ${{ !cancelled() && steps.browser-deps.outcome == 'success' }}
        env:
          R3_BROWSER_BINARY: /usr/bin/google-chrome
        run: python tests/r3-async-motion-browser.py
      - name: Check shared result states, motion and matched artboard exports
        if: ${{ !cancelled() && steps.browser-deps.outcome == 'success' }}
        env:
          R3_BROWSER_BINARY: /usr/bin/google-chrome
          R3_EVIDENCE_DIR: artifacts/quote-result
        run: python tests/r3-journey-browser.py
      - name: Check price review and protected snapshots
        if: ${{ !cancelled() && steps.browser-deps.outcome == 'success' }}
        env:
          R3_BROWSER_BINARY: /usr/bin/google-chrome
        run: python tests/r3-price-browser.py
      - name: Check first registration, account drafts and cross-tab conflicts
        if: ${{ !cancelled() && steps.browser-deps.outcome == 'success' }}
        env:
          R3_BROWSER_BINARY: /usr/bin/google-chrome
        run: python tests/r3-price-first-browser.py
      - name: Check freight references and quantity policies
        if: ${{ !cancelled() && steps.browser-deps.outcome == 'success' }}
        env:
          R3_BROWSER_BINARY: /usr/bin/google-chrome
        run: python tests/r3-freight-browser.py
      - name: Check role cases and masked evidence
        if: ${{ !cancelled() && steps.browser-deps.outcome == 'success' }}
        env:
          R3_ROLE_EVIDENCE_DIR: artifacts/role-browser
          R3_BROWSER_BINARY: /usr/bin/google-chrome
        run: python tests/r3-role-browser.py
      - name: Check three signed business identities and connected workflows
        if: ${{ !cancelled() && steps.browser-deps.outcome == 'success' }}
        env:
          R3_ROLE_EVIDENCE_DIR: artifacts/role-browser
          R3_BROWSER_BINARY: /usr/bin/google-chrome
        run: python tests/r3-business-menu-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r3-private-browser-receipts
          path: |
            artifacts/price-workspace/
            artifacts/r1-workspace/
            artifacts/r1-pin-restoration/
            artifacts/saved-businesses/
            artifacts/role-browser/
            artifacts/quote-result/
            artifacts/price-matrix/
            artifacts/freight-browser/
            artifacts/approved-shell/
            artifacts/motion-runtime/
            artifacts/motion-live/
            artifacts/motion21/
            artifacts/r3-auth-motion/
            artifacts/business-date/
            artifacts/qa-mvp/
            artifacts/quote-draft/
            artifacts/frame-pointer/
          if-no-files-found: ignore
          retention-days: 7
  onboarding:
    name: Onboarding, auth returns and source art
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install DOM and bundler test dependencies
        run: npm install --prefix tests/build-tools --no-package-lock --no-audit --no-fund
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and verify Korean fonts for rendered QA
        run: |
          if ! fc-list ':lang=ko' family | grep -F 'Noto Sans CJK' > /dev/null; then
            sudo apt-get -o Acquire::Retries=3 update -qq
            sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends fonts-noto-cjk
            fc-cache -f
          fi
          fc-list ':lang=ko:charset=ac00' family | sort -u
          fc-list ':lang=ko:charset=ac00' family | grep -F 'Noto Sans CJK' > /dev/null
          fc-match 'sans-serif:lang=ko' --format '%{family} | %{file}\n'
      - run: python -m pip install playwright==1.56.0
        id: browser-deps
      - name: Check onboarding source art, member menus, auth returns and footer
        if: ${{ !cancelled() && steps.browser-deps.outcome == 'success' }}
        env:
          R3_BROWSER_BINARY: /usr/bin/google-chrome
        run: python tests/r3-onboarding-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: onboarding-browser-receipts
          path: |
            artifacts/r3-auth-motion/
            artifacts/motion21/gooey-product/
            artifacts/qa-mvp/
            artifacts/frame-pointer/
          if-no-files-found: warn
          retention-days: 7
  research:
    name: Standalone research app and R1 integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and verify Korean fonts for rendered QA
        run: |
          if ! fc-list ':lang=ko' family | grep -F 'Noto Sans CJK' > /dev/null; then
            sudo apt-get -o Acquire::Retries=3 update -qq
            sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends fonts-noto-cjk
            fc-cache -f
          fi
          fc-list ':lang=ko:charset=ac00' family | sort -u
          fc-list ':lang=ko:charset=ac00' family | grep -F 'Noto Sans CJK' > /dev/null
          fc-match 'sans-serif:lang=ko' --format '%{family} | %{file}\n'
      - name: Install DOM and bundler test dependencies
        run: npm install --prefix tests/build-tools --no-package-lock --no-audit --no-fund
      - run: python -m pip install playwright==1.56.0
      - name: Check the standalone research app and the same app in the R1 shell
        env:
          R3_BROWSER_BINARY: /usr/bin/google-chrome
        run: python tests/research-application-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-application-browser-receipts
          path: artifacts/research-application/
          if-no-files-found: warn
          retention-days: 7
  r1:
    name: R1 actual workspace and controlled states
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and verify Korean fonts for rendered QA
        run: |
          if ! fc-list ':lang=ko' family | grep -F 'Noto Sans CJK' > /dev/null; then
            sudo apt-get -o Acquire::Retries=3 update -qq
            sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends fonts-noto-cjk
            fc-cache -f
          fi
          fc-list ':lang=ko:charset=ac00' family | sort -u
          fc-list ':lang=ko:charset=ac00' family | grep -F 'Noto Sans CJK' > /dev/null
          fc-match 'sans-serif:lang=ko' --format '%{family} | %{file}\n'
      - name: Install the browser driver
        run: python -m pip install playwright==1.56.0
      - name: Check R1 pricing, state controls and annotations
        env:
          R3_BROWSER_BINARY: /usr/bin/google-chrome
        run: python tests/r3-qa-workspace-browser.py
      - name: Restore previous feedback pins and distinguish their provenance
        env:
          R3_BROWSER_BINARY: /usr/bin/google-chrome
        run: python tests/r3-pin-restoration-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r1-canonical-workspace-browser-receipts
          path: |
            artifacts/r1-workspace/
            artifacts/r1-pin-restoration/
          if-no-files-found: warn
          retention-days: 7
  logo:
    name: Product logo and account motion
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install DOM and bundler test dependencies
        run: npm install --prefix tests/build-tools --no-package-lock --no-audit --no-fund
      - name: Verify canonical product source manifest
        run: node scripts/build-product-manifest.mjs --check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and verify Korean fonts for rendered QA
        run: |
          if ! fc-list ':lang=ko' family | grep -F 'Noto Sans CJK' > /dev/null; then
            sudo apt-get -o Acquire::Retries=3 update -qq
            sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends fonts-noto-cjk
            fc-cache -f
          fi
          fc-list ':lang=ko:charset=ac00' family | sort -u
          fc-list ':lang=ko:charset=ac00' family | grep -F 'Noto Sans CJK' > /dev/null
          fc-match 'sans-serif:lang=ko' --format '%{family} | %{file}\n'
      - name: Install browser test driver
        run: python -m pip install playwright==1.56.0
        id: browser-deps
      - name: Check original logo arrival and account stack on real product routes
        if: ${{ !cancelled() && steps.browser-deps.outcome == 'success' }}
        env:
          R3_BROWSER_BINARY: /usr/bin/google-chrome
          R3_LOGO_EVIDENCE_DIR: artifacts/logo-correction
        run: python tests/product-logo-browser.py
      - name: Complete account-panel business operations through actual handlers
        if: ${{ !cancelled() && steps.browser-deps.outcome == 'success' }}
        env:
          R3_BROWSER_BINARY: /usr/bin/google-chrome
        run: python tests/product-account-panels-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-logo-correction-browser-receipts
          path: |
            artifacts/logo-correction/
            artifacts/account-panels/
          if-no-files-found: warn
          retention-days: 7

  motion21:
    name: Motion 21 and Gooey browser frames
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install DOM and bundler test dependencies
        run: npm install --prefix tests/build-tools --no-package-lock --no-audit --no-fund
      - name: Verify canonical product source manifest
        run: node scripts/build-product-manifest.mjs --check
      - name: Verify R1 QA and product runtime sources agree
        run: node scripts/r3/build-qa-review-runtime.mjs --check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and verify Korean fonts for motion measurements
        run: |
          if ! fc-list ':lang=ko' family | grep -F 'Noto Sans CJK' > /dev/null; then
            sudo apt-get -o Acquire::Retries=3 update -qq
            sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends fonts-noto-cjk
            fc-cache -f
          fi
          fc-list ':lang=ko:charset=ac00' family | sort -u
          fc-list ':lang=ko:charset=ac00' family | grep -F 'Noto Sans CJK' > /dev/null
      - name: Install browser test driver
        id: browser-deps
        run: python -m pip install playwright==1.56.0
      - name: Verify measured text, continuous control motion and reduced motion
        if: ${{ !cancelled() && steps.browser-deps.outcome == 'success' }}
        env:
          R3_BROWSER_BINARY: /usr/bin/google-chrome
        run: python tests/r3-common-motion-browser.py
      - name: Verify signed workflow, receipt, billing and evidence motions
        if: ${{ !cancelled() && steps.browser-deps.outcome == 'success' }}
        env:
          R3_BROWSER_BINARY: /usr/bin/google-chrome
        run: python tests/r3-workflow-motion-browser.py
      - name: Verify dashboard springs, draggable widgets and Gooey menu
        if: ${{ !cancelled() && steps.browser-deps.outcome == 'success' }}
        env:
          R3_BROWSER_BINARY: /usr/bin/google-chrome
        run: python tests/r3-admin-motion-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: motion21-browser-receipts
          path: artifacts/motion21/
          if-no-files-found: warn
          retention-days: 7

  product_workflows:
    name: Product forms, navigation and admin workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install DOM and bundler test dependencies
        run: npm install --prefix tests/build-tools --no-package-lock --no-audit --no-fund
      - name: Verify canonical product source manifest
        run: node scripts/build-product-manifest.mjs --check
      - name: Verify canonical product UI bootstrap
        run: node scripts/r3/build-product-ui-bootstrap.mjs --check
      - name: Verify R1 QA and product runtime sources agree
        run: node scripts/r3/build-qa-review-runtime.mjs --check
      - name: Check serialized clients after Worker bundling
        run: |
          node tests/r3-bundled-clients.mjs
          node tests/r3-admin-common-dom.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and verify Korean fonts for rendered QA
        run: |
          if ! fc-list ':lang=ko' family | grep -F 'Noto Sans CJK' > /dev/null; then
            sudo apt-get -o Acquire::Retries=3 update -qq
            sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends fonts-noto-cjk
            fc-cache -f
          fi
          fc-list ':lang=ko:charset=ac00' family | sort -u
          fc-list ':lang=ko:charset=ac00' family | grep -F 'Noto Sans CJK' > /dev/null
          fc-match 'sans-serif:lang=ko' --format '%{family} | %{file}\n'
      - name: Install browser test driver
        id: browser-deps
        run: python -m pip install playwright==1.56.0
      # Preserve each failed outcome while still running the other two scripts.
      # These three checks moved from ia; no browser scenario runs twice here.
      - name: Check business forms, proof and signature review at three widths
        if: ${{ !cancelled() && steps.browser-deps.outcome == 'success' }}
        env:
          R3_BROWSER_BINARY: /usr/bin/google-chrome
        run: python tests/r3-business-feedback-browser.py
      - name: Check pass filtering, tag search, profile settings and booking hours
        if: ${{ !cancelled() && steps.browser-deps.outcome == 'success' }}
        env:
          R3_BROWSER_BINARY: /usr/bin/google-chrome
        run: python tests/r3-navigation-browser.py
      - name: Exercise controlled requests and approved admin interactions in the protected QA frame
        if: ${{ !cancelled() && steps.browser-deps.outcome == 'success' }}
        env:
          R3_BROWSER_BINARY: /usr/bin/google-chrome
        run: python tests/r3-admin-common-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-workflow-browser-receipts
          path: |
            artifacts/business-date/
            artifacts/motion21/consultation/
            artifacts/motion-runtime/
            artifacts/frame-pointer/
          if-no-files-found: warn
          retention-days: 7
