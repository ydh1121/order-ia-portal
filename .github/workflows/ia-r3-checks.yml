name: IA private QA
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ia:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run test:ia
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.56.0
        id: browser-deps
      - name: Compare approved QA 1.0 and protected R3 shell at matching viewports
        if: ${{ !cancelled() && steps.browser-deps.outcome == 'success' }}
        env:
          R3_BROWSER_BINARY: /usr/bin/google-chrome
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python tests/r3-approved-shell-browser.py
      - name: Check protected navigation, SQLite transactions and product forms
        if: ${{ !cancelled() && steps.browser-deps.outcome == 'success' }}
        env:
          R3_BROWSER_BINARY: /usr/bin/google-chrome
        run: python tests/r3-browser.py
      - name: Check annotations, pin restoration and editable download
        if: ${{ !cancelled() && steps.browser-deps.outcome == 'success' }}
        env:
          R3_BROWSER_BINARY: /usr/bin/google-chrome
        run: python tests/r3-annotation-browser.py
      - name: Check onboarding source art, member menus, auth returns and footer
        if: ${{ !cancelled() && steps.browser-deps.outcome == 'success' }}
        env:
          R3_BROWSER_BINARY: /usr/bin/google-chrome
        run: python tests/r3-onboarding-browser.py
      - name: Check business forms, proof and signature review at three widths
        if: ${{ !cancelled() && steps.browser-deps.outcome == 'success' }}
        env:
          R3_BROWSER_BINARY: /usr/bin/google-chrome
        run: python tests/r3-business-feedback-browser.py
      - name: Check pass filtering, tag search, profile settings and booking hours
        if: ${{ !cancelled() && steps.browser-deps.outcome == 'success' }}
        env:
          R3_BROWSER_BINARY: /usr/bin/google-chrome
        run: python tests/r3-navigation-browser.py
      - name: Check detailed quote lists, keyboard and swipe confirmation
        if: ${{ !cancelled() && steps.browser-deps.outcome == 'success' }}
        env:
          R3_BROWSER_BINARY: /usr/bin/google-chrome
        run: python tests/r3-questions-browser.py
      - name: Check price review and protected snapshots
        if: ${{ !cancelled() && steps.browser-deps.outcome == 'success' }}
        env:
          R3_BROWSER_BINARY: /usr/bin/google-chrome
        run: python tests/r3-price-browser.py
      - name: Check role cases and masked evidence
        if: ${{ !cancelled() && steps.browser-deps.outcome == 'success' }}
        env:
          R3_ROLE_EVIDENCE_DIR: artifacts/role-browser
          R3_BROWSER_BINARY: /usr/bin/google-chrome
        run: python tests/r3-role-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r3-private-browser-receipts
          path: |
            artifacts/role-browser/
            artifacts/approved-shell/
          if-no-files-found: ignore
          retention-days: 7
