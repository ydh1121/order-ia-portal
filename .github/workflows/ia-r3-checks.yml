name: IA private QA
on:
  push:
    branches: [main, feat/ia-r3-private-0585]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ia:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run test:ia
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.56.0
      - name: Verify protected page and SQLite-backed review transactions in Chrome
        env:
          R3_ROLE_EVIDENCE_DIR: artifacts/role-browser
          R3_BROWSER_BINARY: /usr/bin/google-chrome
        run: |
          python tests/r3-browser.py
          python tests/r3-annotation-browser.py
          python tests/r3-price-browser.py
          python tests/r3-role-browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r3-private-browser-receipts
          path: artifacts/role-browser/
          if-no-files-found: ignore
          retention-days: 7
